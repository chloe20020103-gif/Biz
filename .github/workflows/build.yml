name: 便當計數_自動打包IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: 編譯產生IPA
    runs-on: macos-15
    timeout-minutes: 20

    steps:
    - name: 下載倉庫檔案
      uses: actions/checkout@v4

    - name: 列出所有檔案
      run: |
        echo "📂 倉庫內檔案："
        ls -la

    # 處理壓縮檔
    - name: 解壓縮
      run: |
        for zip in *.zip; do
          [ -f "$zip" ] || continue
          echo "📦 解壓：$zip"
          unzip -q -o "$zip"
          rm "$zip"
        done
        ls -la

    # 辨識並整理 Swift Playgrounds 專案
    - name: 整理專案結構
      run: |
        if [ -d "便當計數.swiftpm" ]; then
          echo "✅ 找到便當計數.swiftpm"
          mkdir -p Sources/便當計數
          # 複製程式碼
          if [ -d "便當計數.swiftpm/Sources" ]; then
            cp -R 便當計數.swiftpm/Sources/* Sources/便當計數/
          else
            find 便當計數.swiftpm -name "*.swift" -exec cp --parents {} Sources/便當計數/ \;
          fi
          # 複製資源檔
          cp -R 便當計數.swiftpm/Resources/* ./ 2>/dev/null || true
        elif [ -f "便當計數.ipa" ]; then
          echo "✅ 找到現成IPA，直接複製"
          mkdir -p Output
          cp 便當計數.ipa Output/
          exit 0
        else
          echo "⚠️ 嘗試尋找所有 Swift 檔案"
          find . -name "*.swift" -type f
        fi
        ls -la Sources/ 2>/dev/null || true

    - name: 安裝編譯工具
      run: |
        brew install xcbeautify xcodegen
        echo "✅ 工具安裝完成"

    - name: 生成標準 Xcode 專案
      run: |
        cat > project.yml << 'YML'
name: 便當計數
options:
  bundleIdPrefix: com.chloe-biz
  deploymentTarget:
    iOS: "17.0"
  platform: iOS
  usesTabs: false
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  便當計數:
    type: application
    platform: iOS
    sources: ["Sources/便當計數"]
    resources: ["Resources"]
YML
        xcodegen generate
        echo "✅ Xcode 專案生成完成"

    - name: 編譯與匯出IPA
      run: |
        xcodebuild archive \
          -project 便當計數.xcodeproj \
          -scheme 便當計數 \
          -configuration Release \
          -archivePath App.xcarchive \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcbeautify

        xcodebuild -exportArchive \
          -archivePath App.xcarchive \
          -exportOptionsPlist <(echo '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <false/>
          </dict>
          </plist>') \
          -exportPath ./Output
        echo "✅ IPA 產生完成"

    - name: 上傳成品
      uses: actions/upload-artifact@v4
      with:
        name: 便當計數_安裝檔
        path: ./Output/*.ipa
        retention-days: 90
