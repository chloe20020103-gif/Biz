name: 便當計數_自動打包
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: 建立專案設定
      run: |
        cat > project.yml << 'YML'
name: 便當計數
options:
  bundleIdPrefix: com.chloe
  deploymentTarget:
    iOS: "17.0"
  platform: iOS
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
targets:
  便當計數:
    type: application
    platform: iOS
    sources:
      - path: Sources/便當計數
      - 便當計數App.swift
YML

    - name: 安裝工具並生成專案
      run: |
        brew install xcbeautify xcodegen
        xcodegen generate

    - name: 編譯與匯出IPA
      run: |
        xcodebuild archive \
          -project 便當計數.xcodeproj \
          -scheme 便當計數 \
          -configuration Release \
          -archivePath App.xcarchive \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          | xcbeautify
        
        xcodebuild -exportArchive \
          -archivePath App.xcarchive \
          -exportOptionsPlist <(echo '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>method</key><string>ad-hoc</string><key>signingStyle</key><string>manual</string></dict></plist>') \
          -exportPath ./Output

    - name: 上傳成品
      uses: actions/upload-artifact@v4
      with:
        name: 便當計數_安裝檔
        path: ./Output/*.ipa
        retention-days: 90
